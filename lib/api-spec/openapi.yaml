components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        displayName:
          type: string
        timezone:
          type: string
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - email
        - onboardingCompleted
        - createdAt
        - updatedAt

    UpdateUserBody:
      type: object
      properties:
        displayName:
          type: string
        timezone:
          type: string
        onboardingCompleted:
          type: boolean

    UserPreferences:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        coachingTone:
          type: string
          enum: [supportive, direct, challenging, gentle]
        checkInFrequency:
          type: string
          enum: [daily, weekly, biweekly, monthly]
        checkInDayOfWeek:
          type: integer
        notificationsEnabled:
          type: boolean
        aiEnabled:
          type: boolean
        discoveryMode:
          type: string
          enum: [quick, deep]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - coachingTone
        - checkInFrequency
        - notificationsEnabled
        - aiEnabled
        - updatedAt

    UpdateUserPreferencesBody:
      type: object
      properties:
        coachingTone:
          type: string
          enum: [supportive, direct, challenging, gentle]
        checkInFrequency:
          type: string
          enum: [daily, weekly, biweekly, monthly]
        checkInDayOfWeek:
          type: integer
        notificationsEnabled:
          type: boolean
        aiEnabled:
          type: boolean
        discoveryMode:
          type: string
          enum: [quick, deep]

    DiscoverySession:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        currentStep:
          type: integer
        totalSteps:
          type: integer
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - status
        - currentStep
        - totalSteps
        - createdAt
        - updatedAt

    DiscoverySessionWithAnswers:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        currentStep:
          type: integer
        totalSteps:
          type: integer
        answers:
          type: object
          additionalProperties: {}
        themes:
          type: array
          items:
            type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - status
        - currentStep
        - totalSteps
        - answers
        - themes
        - createdAt
        - updatedAt

    CreateDiscoverySessionBody:
      type: object
      properties:
        mode:
          type: string
          enum: [quick, deep]
      required:
        - mode

    UpdateDiscoverySessionBody:
      type: object
      properties:
        currentStep:
          type: integer
        answers:
          type: object
          additionalProperties: {}

