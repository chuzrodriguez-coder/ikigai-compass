openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ikigai Compass API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and preferences
  - name: discovery
    description: Discovery flow sessions and reflections
  - name: hypotheses
    description: Ikigai hypotheses management
  - name: growth
    description: Growth plans, goals, milestones
  - name: checkins
    description: Accountability check-ins
  - name: coaching
    description: Coaching sessions
  - name: obstacles
    description: Obstacle tracking
  - name: dashboard
    description: Dashboard summaries and momentum
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    put:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/preferences:
    get:
      operationId: getUserPreferences
      tags: [users]
      summary: Get user preferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    put:
      operationId: updateUserPreferences
      tags: [users]
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /discovery/sessions:
    get:
      operationId: listDiscoverySessions
      tags: [discovery]
      summary: List discovery sessions
      responses:
        "200":
          description: List of discovery sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverySession"
    post:
      operationId: createDiscoverySession
      tags: [discovery]
      summary: Create or resume discovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscoverySessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySession"

  /discovery/sessions/{id}:
    get:
      operationId: getDiscoverySession
      tags: [discovery]
      summary: Get discovery session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovery session with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySessionWithAnswers"
    put:
      operationId: updateDiscoverySession
      tags: [discovery]
      summary: Update discovery session answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiscoverySessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySession"

  /discovery/sessions/{id}/complete:
    post:
      operationId: completeDiscoverySession
      tags: [discovery]
      summary: Mark discovery session complete and trigger synthesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverySession"

  /discovery/reflections:
    get:
      operationId: listReflections
      tags: [discovery]
      summary: List reflection entries
      responses:
        "200":
          description: List of reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReflectionEntry"
    post:
      operationId: createReflection
      tags: [discovery]
      summary: Create reflection entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReflectionBody"
      responses:
        "201":
          description: Created reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionEntry"

  /discovery/reflections/{id}:
    get:
      operationId: getReflection
      tags: [discovery]
      summary: Get reflection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionEntry"
    put:
      operationId: updateReflection
      tags: [discovery]
      summary: Update reflection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReflectionBody"
      responses:
        "200":
          description: Updated reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionEntry"

  /hypotheses:
    get:
      operationId: listHypotheses
      tags: [hypotheses]
      summary: List Ikigai hypotheses
      responses:
        "200":
          description: List of hypotheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IkigaiHypothesis"
    post:
      operationId: createHypothesis
      tags: [hypotheses]
      summary: Create Ikigai hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHypothesisBody"
      responses:
        "201":
          description: Created hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IkigaiHypothesis"

  /hypotheses/{id}:
    get:
      operationId: getHypothesis
      tags: [hypotheses]
      summary: Get Ikigai hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IkigaiHypothesis"
    put:
      operationId: updateHypothesis
      tags: [hypotheses]
      summary: Update Ikigai hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHypothesisBody"
      responses:
        "200":
          description: Updated hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IkigaiHypothesis"
    delete:
      operationId: deleteHypothesis
      tags: [hypotheses]
      summary: Delete hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hypotheses/{id}/accept:
    post:
      operationId: acceptHypothesis
      tags: [hypotheses]
      summary: Accept hypothesis as active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IkigaiHypothesis"

  /hypotheses/synthesize:
    post:
      operationId: synthesizeHypotheses
      tags: [hypotheses]
      summary: AI-synthesize Ikigai hypotheses from discovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeHypothesesBody"
      responses:
        "200":
          description: Generated hypotheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IkigaiHypothesis"

  /growth/plans:
    get:
      operationId: listGrowthPlans
      tags: [growth]
      summary: List growth plans
      responses:
        "200":
          description: List of growth plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrowthPlan"
    post:
      operationId: createGrowthPlan
      tags: [growth]
      summary: Create growth plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrowthPlanBody"
      responses:
        "201":
          description: Created growth plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthPlan"

  /growth/plans/{id}:
    get:
      operationId: getGrowthPlan
      tags: [growth]
      summary: Get growth plan with milestones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Growth plan with details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthPlanWithDetails"
    put:
      operationId: updateGrowthPlan
      tags: [growth]
      summary: Update growth plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGrowthPlanBody"
      responses:
        "200":
          description: Updated growth plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthPlan"

  /growth/milestones:
    get:
      operationId: listMilestones
      tags: [growth]
      summary: List milestones
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"
    post:
      operationId: createMilestone
      tags: [growth]
      summary: Create milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestoneBody"
      responses:
        "201":
          description: Created milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /growth/milestones/{id}:
    put:
      operationId: updateMilestone
      tags: [growth]
      summary: Update milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMilestoneBody"
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
    delete:
      operationId: deleteMilestone
      tags: [growth]
      summary: Delete milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /growth/actions:
    get:
      operationId: listTaskActions
      tags: [growth]
      summary: List weekly task actions
      responses:
        "200":
          description: List of task actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAction"
    post:
      operationId: createTaskAction
      tags: [growth]
      summary: Create task action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskActionBody"
      responses:
        "201":
          description: Created task action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAction"

  /growth/actions/{id}:
    put:
      operationId: updateTaskAction
      tags: [growth]
      summary: Update task action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskActionBody"
      responses:
        "200":
          description: Updated task action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAction"

  /growth/habits:
    get:
      operationId: listHabits
      tags: [growth]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [growth]
      summary: Create habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHabitBody"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /growth/habits/{id}:
    put:
      operationId: updateHabit
      tags: [growth]
      summary: Update habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHabitBody"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [growth]
      summary: Delete habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /checkins:
    get:
      operationId: listCheckIns
      tags: [checkins]
      summary: List accountability check-ins
      responses:
        "200":
          description: List of check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
    post:
      operationId: createCheckIn
      tags: [checkins]
      summary: Submit accountability check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInBody"
      responses:
        "201":
          description: Created check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  /checkins/{id}:
    get:
      operationId: getCheckIn
      tags: [checkins]
      summary: Get check-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  /coaching/sessions:
    get:
      operationId: listCoachingSessions
      tags: [coaching]
      summary: List coaching sessions
      responses:
        "200":
          description: List of coaching sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachingSession"
    post:
      operationId: createCoachingSession
      tags: [coaching]
      summary: Start a coaching session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoachingSessionBody"
      responses:
        "201":
          description: Created coaching session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSession"

  /coaching/sessions/{id}:
    get:
      operationId: getCoachingSession
      tags: [coaching]
      summary: Get coaching session with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaching session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSessionWithMessages"

  /obstacles:
    get:
      operationId: listObstacles
      tags: [obstacles]
      summary: List obstacles
      responses:
        "200":
          description: List of obstacles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Obstacle"
    post:
      operationId: createObstacle
      tags: [obstacles]
      summary: Log an obstacle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObstacleBody"
      responses:
        "201":
          description: Created obstacle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obstacle"

  /obstacles/{id}:
    put:
      operationId: updateObstacle
      tags: [obstacles]
      summary: Update obstacle status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObstacleBody"
      responses:
        "200":
          description: Updated obstacle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obstacle"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary with momentum score
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/momentum:
    get:
      operationId: getMomentumHistory
      tags: [dashboard]
      summary: Get momentum score history
      responses:
        "200":
          description: Momentum history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressSnapshot"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /reminders/due:
    get:
      tags: [Reminders]
      summary: Get reminders that are currently due
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of due reminders with trigger info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderWithTrigger"

  /reminders/{id}/next-trigger:
    get:
      tags: [Reminders]
      summary: Get the next trigger time for a reminder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trigger info for the reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"
        "404":
          description: Reminder not found

  /accountability/status:
    get:
      tags: [Accountability]
      summary: Get the user's accountability and momentum status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accountability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityStatus"

  /checkins/stagnation/{planId}:
    get:
      tags: [Checkins]
      summary: Detect stagnation for a growth plan
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stagnation status for the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagnationResult"
        "404":
          description: Plan not found

  /obstacles/{id}/help:
    post:
      tags: [Obstacles]
      summary: Get AI-generated help for overcoming an obstacle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObstacleHelpBody"
      responses:
        "200":
          description: AI help for the obstacle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObstacleHelpResponse"
        "404":
          description: Obstacle not found

  /growth/plans/{id}/summary:
    get:
      tags: [Growth]
      summary: Get an AI-generated period summary for a growth plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Period summary for the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSummaryResponse"
        "404":
          description: Plan not found

  /ai/extract-themes:
    post:
      tags: [AI]
      summary: Extract themes from a block of text using AI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
