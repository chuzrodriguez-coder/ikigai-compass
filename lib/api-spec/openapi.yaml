          type: string
        themes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - prompt
        - content
        - themes
        - createdAt
        - updatedAt

